<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Summary</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Broker Summary</h1><span id="info">Memuat…</span></header>
<main>
<div class="bar">
  <label>Dari<input id="from" type="date"></label>
  <label>Sampai<input id="to" type="date"></label>
  <label>Emiten<input id="emiten" placeholder="BBCA, BBRI" size="14"></label>
  <label>Broker (opsional)<input id="broker" placeholder="YP, PD" size="12"></label>
  <button id="go">Tampilkan</button>
  <button id="csv" class="alt">Unduh CSV</button>
</div>
<div id="msg" role="alert"></div>

<h2 class="sub">1. Tanggal tersedia per emiten (seluruh data) <span class="mute">· tebal = masuk rentang Dari–Sampai</span></h2>
<div class="card dates" id="dates"><span class="mute">Isi emiten lalu klik Tampilkan.</span></div>

<h2 class="sub">2. Tabel utama</h2>
<div class="card scroll"><table id="t"></table></div>

<h2 class="sub" style="margin-top:22px">3. Chart lot per broker <span class="mute">· 20 broker dengan volume terbesar</span></h2>
<div class="card" style="padding:12px">
  <div class="bar">
    <label>Emiten chart<select id="cEm"></select></label>
    <label>Tampilan<select id="cMode"><option value="harian">Lot harian (net)</option><option value="kum">Lot kumulatif</option></select></label>
    <label>Tambah broker<div class="row"><input id="cAdd" list="bkList" placeholder="mis. YP" size="8"><button id="cAddBtn" class="alt">Tambah</button></div></label>
    <button id="cReset" class="alt">Reset top 20</button>
  </div>
  <datalist id="bkList"></datalist>
  <div id="cChips"></div>
  <div id="cMsg" class="mute">Isi rentang dan emiten, lalu klik Tampilkan.</div>
  <div id="chart"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="config.js"></script>
<script>

const COLS = [
  {k:"broker"},{k:"emiten"},
  {k:"value_net",n:0,s:1},{k:"lot_net",n:0,s:1},{k:"volume",n:0},{k:"bias_net",n:4,s:1},
  {k:"freq_net",n:0},{k:"avg_acc",n:2},{k:"avg_dist",n:2},{k:"price",n:2,s:1},
  {k:"vwap",n:2},{k:"average_price_net",n:2},{k:"sell_lot",n:0},{k:"buy_lot",n:0},
  {k:"stddev",n:2},{k:"cv_lot",n:4},{k:"broker_active_days",n:0},{k:"emiten_total_days",n:0},{k:"consistency",n:4}
];
const MAXSHOW = 1500;
let rows = [], sortKey = "value_net", asc = false;

function fmt(v, n) {
  return v == null ? "-" : Number(v).toLocaleString("id-ID", {minimumFractionDigits: n, maximumFractionDigits: n});
}

function draw() {
  const s = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
  });
  $("t").innerHTML = "<thead><tr>" + COLS.map(c =>
    `<th tabindex="0" data-k="${c.k}">${c.k}${sortKey === c.k ? (asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr></thead><tbody>" +
    s.slice(0, MAXSHOW).map(r => "<tr>" + COLS.map(c => {
      const v = r[c.k];
      const cls = c.s && v ? (v > 0 ? "pos" : "neg") : "";
      return `<td class="${cls}">${c.n == null ? (v ?? "") : fmt(v, c.n)}</td>`;
    }).join("") + "</tr>").join("") + "</tbody>";
  $("t").querySelectorAll("th").forEach(th => {
    const go = () => { const k = th.dataset.k; asc = sortKey === k ? !asc : false; sortKey = k; draw(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}

function drawDates(list, d1, d2) {
  const box = $("dates");
  if (!list.length) { box.innerHTML = '<span class="mute">Tidak ada tanggal untuk emiten ini.</span>'; return; }
  const open = list.length === 1 ? " open" : "";
  box.innerHTML = list.slice(0, 300).map(r =>
    `<details${open}><summary><b>${r.emiten}</b> · ${r.total_days} tanggal · ${r.dates[0]} s/d ${r.dates[r.dates.length - 1]}</summary><div class="dl">${r.dates.map(d => d >= d1 && d <= d2 ? `<span class="in">${d}</span>` : d).join(", ")}</div></details>`).join("") +
    (list.length > 300 ? `<div class="mute">Menampilkan 300 dari ${list.length} emiten. Isi emiten tertentu untuk mempersempit.</div>` : "");
}
async function loadDates(args) {
  if (!args.p_emitens) { $("dates").innerHTML = '<span class="mute">Isi emiten untuk melihat daftar tanggal seluruh datanya.</span>'; return; }
  $("dates").innerHTML = '<span class="mute">Memuat…</span>';
  try {
    const {data, error} = await sb.rpc("broksum_dates", {p_emitens: args.p_emitens}).range(0, 999);
    if (error) throw error;
    drawDates(data, args.p_from, args.p_to);
  } catch (e) {
    $("dates").innerHTML = '<span class="neg">Gagal memuat daftar tanggal: ' + (e.message || e) + '. Pastikan fungsi broksum_dates sudah dibuat di Supabase.</span>';
  }
}

async function load() {
  msg("");
  const em = parse($("emiten").value), br = parse($("broker").value);
  const d1 = $("from").value, d2 = $("to").value;
  if (!d1 || !d2) return msg("Isi tanggal Dari dan Sampai.");
  if (d1 > d2) return msg("Tanggal Dari tidak boleh setelah Sampai.");
  const args = {p_from: d1, p_to: d2, p_emitens: em.length ? em : null, p_brokers: br.length ? br : null};
  $("go").disabled = true; $("info").textContent = "Memuat…";
  try {
    let all = [], from = 0;
    while (true) {
      const {data, error} = await sb.rpc("broksum_main", args).range(from, from + 999);
      if (error) throw error;
      all = all.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    rows = all.map(r => { COLS.forEach(c => { if (c.n != null) r[c.k] = r[c.k] == null ? null : Number(r[c.k]); }); return r; });
    sortKey = "value_net"; asc = false; draw(); loadDates(args);
    ch.pending = args; runChart();
    $("info").textContent = d1 + " s/d " + d2 + " · " + rows.length.toLocaleString("id-ID") + " baris" + (rows.length > MAXSHOW ? ` (tampil ${MAXSHOW} teratas, CSV memuat semua)` : "");
  } catch (e) {
    msg("Gagal memuat: " + (e.message || e) + ". Pastikan fungsi broksum_main sudah dibuat di Supabase.");
    $("info").textContent = "Terjadi kesalahan";
  }
  $("go").disabled = false;
}

function exportCsv() {
  if (!rows.length) return msg("Belum ada data untuk diunduh.");
  const head = COLS.map(c => c.k).join(",");
  const body = rows.map(r => COLS.map(c => r[c.k] ?? "").join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head + "\n" + body], {type: "text/csv"}));
  a.download = "broker_summary.csv"; a.click();
}
/* ===== CHART ===== */
const MAXB = 20;
const ch = {chart: null, a: null, em: null, dates: [], rank: [], sel: [], cache: new Map(), colors: new Map(), n: 0, dirty: false, pending: null};
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const kmb = v => {
  const a = Math.abs(v), s = v < 0 ? "-" : "", f = (x, u) => s + (+x.toFixed(1)) + u;
  return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + a;
};
const cmsg = (t, bad) => { $("cMsg").textContent = t || ""; $("cMsg").className = bad ? "neg" : "mute"; };
function colorOf(b) {
  if (!ch.colors.has(b)) {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    ch.colors.set(b, `hsl(${(ch.n++ * 137.5) % 360},65%,${dark ? 62 : 45}%)`);
  }
  return ch.colors.get(b);
}
async function rpcAll(fn, args) {
  let all = [], from = 0;
  while (true) {
    const {data, error} = await sb.rpc(fn, args).range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}
async function ensureData(list) {
  const miss = list.filter(b => !ch.cache.has(b));
  if (!miss.length) return;
  const r = await rpcAll("broksum_series", {p_from: ch.a.p_from, p_to: ch.a.p_to, p_emiten: ch.em, p_brokers: miss});
  miss.forEach(b => ch.cache.set(b, new Map()));
  r.forEach(x => ch.cache.get(x.broker).set(x.trade_date, +x.lot));
}
async function runChart() {
  const a = ch.pending; if (!a) return;
  ch.pending = null; ch.a = a;
  if (!a.p_emitens) { $("cEm").innerHTML = ""; ch.sel = []; ch.rank = []; ch.dates = []; cmsg("Isi emiten untuk menampilkan chart."); renderChart(); return; }
  const prev = $("cEm").value;
  $("cEm").innerHTML = a.p_emitens.map(e => `<option>${e}</option>`).join("");
  if (a.p_emitens.includes(prev)) $("cEm").value = prev;
  await refreshChart();
}
async function refreshChart() {
  cmsg("Memuat chart…");
  try {
    ch.em = $("cEm").value; ch.cache = new Map();
    const [rank, dd] = await Promise.all([
      rpcAll("broksum_rank", {p_from: ch.a.p_from, p_to: ch.a.p_to, p_emiten: ch.em}),
      rpcAll("broksum_dates", {p_from: ch.a.p_from, p_to: ch.a.p_to, p_emitens: [ch.em]})
    ]);
    ch.rank = rank.map(r => ({broker: r.broker, volume: +r.volume}));
    ch.dates = dd.length ? dd[0].dates : [];
    ch.sel = ch.rank.slice(0, MAXB).map(r => r.broker);
    await ensureData(ch.sel);
    cmsg(ch.dates.length ? "" : "Tidak ada data untuk emiten ini pada rentang tersebut.");
    renderChart();
  } catch (e) {
    cmsg("Gagal memuat chart: " + (e.message || e) + ". Pastikan fungsi broksum_rank, broksum_series, dan broksum_dates sudah dibuat di Supabase.", 1);
  }
}
function renderChart() {
  const rk = new Map(ch.rank.map(r => [r.broker, r.volume]));
  $("cChips").innerHTML = ch.sel.map(b =>
    `<span class="chip" data-b="${b}"><i style="background:${colorOf(b)}"></i>${b} <span class="mute">${kmb(rk.get(b) || 0)}</span><button data-r="${b}" aria-label="Hapus ${b}">×</button></span>`).join("");
  $("bkList").innerHTML = ch.rank.filter(r => !ch.sel.includes(r.broker)).map(r => `<option value="${r.broker}">${kmb(r.volume)}</option>`).join("");
  document.querySelectorAll("#cChips button").forEach(x => x.onclick = () => { ch.sel = ch.sel.filter(b => b !== x.dataset.r); renderChart(); });
  document.querySelectorAll("#cChips .chip").forEach(c => {
    c.onmouseenter = () => ch.chart && ch.chart.dispatchAction({type: "highlight", seriesName: c.dataset.b});
    c.onmouseleave = () => ch.chart && ch.chart.dispatchAction({type: "downplay", seriesName: c.dataset.b});
  });
  if (!ch.chart) ch.chart = echarts.init($("chart"));
  const ink = cssv("--ink"), mute = cssv("--mute"), line = cssv("--line"), kum = $("cMode").value === "kum";
  const series = ch.sel.map(b => {
    const m = ch.cache.get(b) || new Map(); let acc = 0;
    return {name: b, type: "line", smooth: true, showSymbol: false, emphasis: {focus: "series"},
      lineStyle: {width: 1.6, color: colorOf(b)}, itemStyle: {color: colorOf(b)},
      data: ch.dates.map(d => { const v = m.get(d) || 0; return kum ? (acc += v) : v; })};
  });
  ch.chart.setOption({
    animation: false,
    grid: {left: 58, right: 20, top: 16, bottom: 70},
    tooltip: {trigger: "axis", confine: true, backgroundColor: cssv("--card"), borderColor: line, textStyle: {color: ink, fontSize: 11},
      formatter: ps => `<b>${ps[0].axisValueLabel}</b><br>` + ps.slice().sort((a, b) => b.value - a.value).map(p => `${p.marker}${p.seriesName} <b>${kmb(p.value)}</b>`).join("<br>")},
    xAxis: {type: "category", data: ch.dates, boundaryGap: false, axisLabel: {color: mute}, axisLine: {lineStyle: {color: line}}},
    yAxis: {type: "value", name: "Lot", nameTextStyle: {color: mute}, axisLabel: {color: mute, formatter: kmb}, splitLine: {lineStyle: {color: line}}},
    dataZoom: [{type: "inside"}, {type: "slider", height: 18, bottom: 8}],
    series
  }, true);
}
async function addBroker() {
  const b = $("cAdd").value.trim().toUpperCase(); if (!b) return;
  if (ch.sel.includes(b)) return cmsg("Broker " + b + " sudah ada di chart.");
  if (!ch.rank.some(r => r.broker === b)) return cmsg("Broker " + b + " tidak punya data pada periode ini.", 1);
  if (ch.sel.length >= MAXB) return cmsg("Maksimal " + MAXB + " broker. Hapus salah satu dulu.", 1);
  try { cmsg("Memuat…"); await ensureData([b]); ch.sel.push(b); $("cAdd").value = ""; cmsg(""); renderChart(); }
  catch (e) { cmsg("Gagal: " + (e.message || e), 1); }
}
$("cAddBtn").onclick = addBroker; $("cAdd").onkeydown = e => { if (e.key === "Enter") addBroker(); };
$("cMode").onchange = renderChart; $("cEm").onchange = refreshChart;
$("cReset").onclick = async () => {
  ch.sel = ch.rank.slice(0, MAXB).map(r => r.broker);
  try { await ensureData(ch.sel); renderChart(); } catch (e) { cmsg("Gagal: " + (e.message || e), 1); }
};
addEventListener("resize", () => ch.chart && ch.chart.resize());

$("go").onclick = load; $("csv").onclick = exportCsv;
document.querySelectorAll("#emiten,#broker").forEach(i => i.onkeydown = e => { if (e.key === "Enter") load(); });
draw();
initInputs().then(run => { if (run) load(); });
</script>
</body>
</html>
