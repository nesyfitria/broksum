<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Summary</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#162033;--mute:#6b7585;--line:#e1e5ec;--acc:#2a56d6;--buy:#0b8a5f;--sell:#c93c3c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#171f2e;--ink:#e6eaf2;--mute:#8d98ab;--line:#26324a;--acc:#6f93ff;--buy:#2ec08a;--sell:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
#info,.mute{color:var(--mute);font-size:13px}
main{padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.row{display:flex;gap:6px}
input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}
button.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;min-height:28px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{background:none;border:0;color:var(--mute);padding:0 6px;font-size:16px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}
.scroll{overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{position:sticky;top:0;background:var(--card);cursor:pointer;font-weight:600;user-select:none}
.pos{color:var(--buy)}.neg{color:var(--sell)}
#msg{color:var(--sell);margin:6px 0;min-height:18px}
</style>
</head>
<body>
<header><h1>Broker Summary</h1><span id="info">Memuat…</span></header>
<main>
<div class="bar">
  <label>Dari<input id="from" type="date"></label>
  <label>Sampai<input id="to" type="date"></label>
  <label>Emiten<input id="emiten" placeholder="BBCA, BBRI" size="14"></label>
  <label>Broker (opsional)<input id="broker" placeholder="YP, PD" size="12"></label>
  <button id="go">Tampilkan</button>
  <button id="csv" class="alt">Unduh CSV</button>
</div>
<div id="msg" role="alert"></div>
<div class="card scroll"><table id="t"></table></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== ISI BARIS INI dengan kunci anon public =====
const SUPABASE_URL = "https://mocdrsgehlyjbxgjtxam.supabase.co";
const SUPABASE_ANON_KEY = "ISI_ANON_KEY_DI_SINI";
// ==================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const COLS = [
  {k:"broker"},{k:"emiten"},
  {k:"value_net",n:0,s:1},{k:"lot_net",n:0,s:1},{k:"volume",n:0},{k:"bias_net",n:4,s:1},
  {k:"freq_net",n:0},{k:"avg_acc",n:2},{k:"avg_dist",n:2},{k:"price",n:2,s:1},
  {k:"vwap",n:2},{k:"average_price_net",n:2},{k:"sell_lot",n:0},{k:"buy_lot",n:0},
  {k:"stddev",n:2},{k:"cv_lot",n:4},{k:"broker_active_days",n:0},{k:"emiten_total_days",n:0},{k:"consistency",n:4}
];
const MAXSHOW = 1500;
let rows = [], sortKey = "value_net", asc = false;

function fmt(v, n) {
  return v == null ? "-" : Number(v).toLocaleString("id-ID", {minimumFractionDigits: n, maximumFractionDigits: n});
}
const parse = s => s.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
const msg = t => $("msg").textContent = t || "";

function draw() {
  const s = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
  });
  $("t").innerHTML = "<thead><tr>" + COLS.map(c =>
    `<th tabindex="0" data-k="${c.k}">${c.k}${sortKey === c.k ? (asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr></thead><tbody>" +
    s.slice(0, MAXSHOW).map(r => "<tr>" + COLS.map(c => {
      const v = r[c.k];
      const cls = c.s && v ? (v > 0 ? "pos" : "neg") : "";
      return `<td class="${cls}">${c.n == null ? (v ?? "") : fmt(v, c.n)}</td>`;
    }).join("") + "</tr>").join("") + "</tbody>";
  $("t").querySelectorAll("th").forEach(th => {
    const go = () => { const k = th.dataset.k; asc = sortKey === k ? !asc : false; sortKey = k; draw(); };
    th.onclick = go; th.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}

async function load() {
  msg("");
  const em = parse($("emiten").value), br = parse($("broker").value);
  const d1 = $("from").value, d2 = $("to").value;
  if (!d1 || !d2) return msg("Isi tanggal Dari dan Sampai.");
  if (d1 > d2) return msg("Tanggal Dari tidak boleh setelah Sampai.");
  const args = {p_from: d1, p_to: d2, p_emitens: em.length ? em : null, p_brokers: br.length ? br : null};
  $("go").disabled = true; $("info").textContent = "Memuat…";
  try {
    let all = [], from = 0;
    while (true) {
      const {data, error} = await sb.rpc("broksum_main", args).range(from, from + 999);
      if (error) throw error;
      all = all.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    rows = all.map(r => { COLS.forEach(c => { if (c.n != null) r[c.k] = r[c.k] == null ? null : Number(r[c.k]); }); return r; });
    sortKey = "value_net"; asc = false; draw();
    $("info").textContent = d1 + " s/d " + d2 + " · " + rows.length.toLocaleString("id-ID") + " baris" + (rows.length > MAXSHOW ? ` (tampil ${MAXSHOW} teratas, CSV memuat semua)` : "");
  } catch (e) {
    msg("Gagal memuat: " + (e.message || e) + ". Pastikan fungsi broksum_main sudah dibuat di Supabase.");
    $("info").textContent = "Terjadi kesalahan";
  }
  $("go").disabled = false;
}

function exportCsv() {
  if (!rows.length) return msg("Belum ada data untuk diunduh.");
  const head = COLS.map(c => c.k).join(",");
  const body = rows.map(r => COLS.map(c => r[c.k] ?? "").join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head + "\n" + body], {type: "text/csv"}));
  a.download = "broker_summary.csv"; a.click();
}
$("go").onclick = load; $("csv").onclick = exportCsv;
document.querySelectorAll("#emiten,#broker").forEach(i => i.onkeydown = e => { if (e.key === "Enter") load(); });

(async function init() {
  draw();
  try {
    const {data, error} = await sb.from("v_broksum").select("trade_date").order("trade_date", {ascending: false}).limit(1);
    if (error) throw error;
    const last = data[0].trade_date, d = new Date(last); d.setDate(d.getDate() - 30);
    $("to").value = last; $("from").value = d.toISOString().slice(0, 10);
    $("info").textContent = "Data terakhir: " + last;
  } catch (e) {
    msg("Tidak bisa terhubung ke Supabase: " + (e.message || e) + ". Cek anon key dan policy RLS.");
    $("info").textContent = "Belum terhubung";
  }
})();
</script>
</body>
</html>
