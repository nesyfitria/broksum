<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Summary</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#162033;--mute:#6b7585;--line:#e1e5ec;--acc:#2a56d6;--buy:#0b8a5f;--sell:#c93c3c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#171f2e;--ink:#e6eaf2;--mute:#8d98ab;--line:#26324a;--acc:#6f93ff;--buy:#2ec08a;--sell:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
#info{color:var(--mute);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}
button.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;color:var(--mute);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.chart{position:relative;height:320px}
.scroll{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--card);cursor:pointer;font-weight:600;user-select:none}
.pos{color:var(--buy)}.neg{color:var(--sell)}
#msg{color:var(--sell);margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<header><h1>Broker Summary</h1><span id="info">Memuat data…</span></header>
<main>
<div class="bar">
  <label>Emiten<input id="emiten" list="emitenList" placeholder="mis. BBCA" size="8"></label>
  <label>Broker<input id="broker" list="brokerList" placeholder="mis. YP" size="6"></label>
  <label>Dari<input id="from" type="date"></label>
  <label>Sampai<input id="to" type="date"></label>
  <button id="go">Tampilkan</button>
  <button id="csv" class="alt">Unduh CSV</button>
</div>
<datalist id="emitenList"></datalist><datalist id="brokerList"></datalist>
<div id="msg" role="alert"></div>
<div class="tabs" role="tablist">
  <button data-tab="byBroker" class="on">Per emiten</button>
  <button data-tab="byEmiten">Per broker</button>
  <button data-tab="harga">Harga</button>
</div>

<section id="byBroker">
  <div class="grid">
    <div class="card"><div class="chart"><canvas id="c1"></canvas></div></div>
    <div class="card"><div class="chart"><canvas id="c2"></canvas></div></div>
  </div>
  <div class="card scroll"><table id="t1"></table></div>
</section>

<section id="byEmiten" class="hide">
  <div class="card"><div class="chart"><canvas id="c3"></canvas></div></div>
  <div class="card scroll"><table id="t2"></table></div>
</section>

<section id="harga" class="hide">
  <div class="card"><div class="chart"><canvas id="c4"></canvas></div></div>
  <div class="card scroll"><table id="t3"></table></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ===== ISI DUA BARIS INI (Supabase > Project Settings > API) =====
const SUPABASE_URL = "https://mocdrsgehlyjbxgjtxam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vY2Ryc2dlaGx5amJ4Z2p0eGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODI4NjEsImV4cCI6MjA5NjA1ODg2MX0.AoQHv1kOBj6XJXdKJUbECZ0OHnCHvJcglzVY0XDu6jM";
// =================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const fmt = n => n == null ? "-" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 0});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const charts = {};
let current = {name: "data", rows: [], cols: []};

async function fetchAll(build) {
  let all = [], from = 0;
  while (true) {
    const {data, error} = await build().range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}

function showMsg(t) { $("msg").textContent = t || ""; }

function drawChart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  const grid = css("--line"), mute = css("--mute");
  cfg.options = Object.assign({responsive: true, maintainAspectRatio: false}, cfg.options || {});
  cfg.options.scales = cfg.options.scales || {x: {}, y: {}};
  Object.values(cfg.options.scales).forEach(s => { s.grid = {color: grid}; s.ticks = Object.assign({color: mute}, s.ticks || {}); });
  cfg.options.plugins = Object.assign({legend: {labels: {color: mute}}}, cfg.options.plugins || {});
  charts[id] = new Chart($(id), cfg);
}

function renderTable(id, cols, rows, name) {
  const t = $(id);
  let sortKey = null, asc = false;
  const draw = () => {
    const data = sortKey ? [...rows].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : -1) * (asc ? 1 : -1)) : rows;
    t.innerHTML = "<thead><tr>" + cols.map(c => `<th tabindex="0" data-k="${c.k}">${c.h}${sortKey === c.k ? (asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr></thead><tbody>" +
      data.map(r => "<tr>" + cols.map(c => {
        const v = r[c.k];
        const cls = c.signed && v !== 0 ? (v > 0 ? "pos" : "neg") : "";
        return `<td class="${cls}">${c.n ? fmt(v) : (v ?? "")}</td>`;
      }).join("") + "</tr>").join("") + "</tbody>";
    t.querySelectorAll("th").forEach(th => {
      const go = () => { const k = th.dataset.k; asc = sortKey === k ? !asc : false; sortKey = k; draw(); };
      th.onclick = go; th.onkeydown = e => { if (e.key === "Enter") go(); };
    });
  };
  draw();
  t.dataset.name = name;
  t._cols = cols; t._rows = rows;
}

function agg(rows, key) {
  const m = {};
  rows.forEach(r => {
    const k = r[key];
    const o = m[k] || (m[k] = {key: k, value: 0, lot: 0, freq: 0, pv: 0, al: 0});
    const w = Math.abs(r.lot);
    o.value += r.value; o.lot += r.lot; o.freq += r.freq; o.pv += r.avg_price * w; o.al += w;
  });
  return Object.values(m).map(o => ({[key]: o.key, value: o.value, lot: o.lot, freq: o.freq, avg_price: o.al ? Math.round(o.pv / o.al) : 0}))
    .sort((a, b) => b.value - a.value);
}

const cols = key => [
  {k: key, h: key === "broker" ? "Broker" : "Emiten"},
  {k: "value", h: "Value", n: 1, signed: 1}, {k: "lot", h: "Lot", n: 1, signed: 1},
  {k: "freq", h: "Freq", n: 1}, {k: "avg_price", h: "Avg price", n: 1}
];

function barChart(id, rows, key, title) {
  const top = rows.slice(0, 10);
  drawChart(id, {type: "bar", data: {labels: top.map(r => r[key]), datasets: [{label: title, data: top.map(r => r.value),
    backgroundColor: top.map(r => r.value >= 0 ? css("--buy") : css("--sell"))}]},
    options: {plugins: {legend: {display: false}, title: {display: true, text: title, color: css("--ink")}}}});
}

async function load() {
  showMsg("");
  const em = $("emiten").value.trim().toUpperCase(), br = $("broker").value.trim().toUpperCase();
  const from = $("from").value, to = $("to").value;
  $("go").disabled = true; $("info").textContent = "Memuat…";
  try {
    // Per emiten: broker mana saja yang bertransaksi
    if (em) {
      const rows = await fetchAll(() => sb.from("v_broksum").select("*").eq("emiten", em).gte("trade_date", from).lte("trade_date", to));
      const a = agg(rows, "broker");
      renderTable("t1", cols("broker"), a, em + "_per_broker");
      barChart("c1", a, "broker", "Top 10 broker (value)");
      const bottom = [...a].reverse();
      drawChart("c2", {type: "bar", data: {labels: bottom.slice(0, 10).map(r => r.broker), datasets: [{label: "Value", data: bottom.slice(0, 10).map(r => r.value), backgroundColor: css("--sell")}]},
        options: {plugins: {legend: {display: false}, title: {display: true, text: "10 broker terendah (value)", color: css("--ink")}}}});
      current = {name: em + "_per_broker", rows: a, cols: cols("broker")};
      // Harga
      const p = await fetchAll(() => sb.from("v_price").select("*").eq("emiten", em).gte("trade_date", from).lte("trade_date", to).order("trade_date"));
      drawChart("c4", {type: "line", data: {labels: p.map(r => r.trade_date), datasets: [{label: "Penutupan " + em, data: p.map(r => r.close), borderColor: css("--acc"), pointRadius: 0, tension: .2}]}});
      renderTable("t3", [{k: "trade_date", h: "Tanggal"}, {k: "open", h: "Open", n: 1}, {k: "high", h: "High", n: 1}, {k: "low", h: "Low", n: 1}, {k: "close", h: "Close", n: 1}, {k: "volume", h: "Volume", n: 1}, {k: "foreign_buy", h: "F. Buy", n: 1}, {k: "foreign_sell", h: "F. Sell", n: 1}], [...p].reverse(), em + "_harga");
    }
    // Per broker: emiten mana saja yang ditransaksikan
    if (br) {
      const rows = await fetchAll(() => sb.from("v_broksum").select("*").eq("broker", br).gte("trade_date", from).lte("trade_date", to));
      const a = agg(rows, "emiten");
      renderTable("t2", cols("emiten"), a, br + "_per_emiten");
      barChart("c3", a, "emiten", "Top 10 emiten untuk broker " + br);
      if (!em) current = {name: br + "_per_emiten", rows: a, cols: cols("emiten")};
    }
    if (!em && !br) showMsg("Isi emiten atau broker terlebih dahulu.");
    $("info").textContent = `Periode ${from} s/d ${to}`;
  } catch (e) {
    showMsg("Gagal memuat: " + (e.message || e) + ". Cek anon key dan policy RLS.");
    $("info").textContent = "Terjadi kesalahan";
  }
  $("go").disabled = false;
}

function exportCsv() {
  if (!current.rows.length) return showMsg("Belum ada data untuk diunduh.");
  const head = current.cols.map(c => c.h).join(",");
  const body = current.rows.map(r => current.cols.map(c => r[c.k]).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head + "\n" + body], {type: "text/csv"}));
  a.download = current.name + ".csv"; a.click();
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["byBroker", "byEmiten", "harga"].forEach(id => $(id).classList.toggle("hide", id !== b.dataset.tab));
  Object.values(charts).forEach(c => c.resize());
});
$("go").onclick = load; $("csv").onclick = exportCsv;
document.querySelectorAll("#emiten,#broker").forEach(i => i.onkeydown = e => { if (e.key === "Enter") load(); });

(async function init() {
  try {
    const {data, error} = await sb.from("v_broksum").select("trade_date").order("trade_date", {ascending: false}).limit(1);
    if (error) throw error;
    const last = data[0].trade_date;
    const d = new Date(last); d.setDate(d.getDate() - 30);
    $("to").value = last; $("from").value = d.toISOString().slice(0, 10);
    const day = await fetchAll(() => sb.from("v_broksum").select("emiten,broker").eq("trade_date", last));
    $("emitenList").innerHTML = [...new Set(day.map(r => r.emiten))].sort().map(v => `<option value="${v}">`).join("");
    $("brokerList").innerHTML = [...new Set(day.map(r => r.broker))].sort().map(v => `<option value="${v}">`).join("");
    $("info").textContent = "Data terakhir: " + last;
  } catch (e) {
    showMsg("Tidak bisa terhubung ke Supabase: " + (e.message || e) + ". Pastikan anon key sudah diisi, view dan policy RLS sudah dibuat.");
    $("info").textContent = "Belum terhubung";
  }
})();
</script>
</body>
</html>
